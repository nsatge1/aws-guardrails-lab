# Checks every change to the Terraform code before it reaches AWS.
name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

# By default, the workflow token can only read the repository.
permissions:
  contents: read

# A new push on the same branch cancels the run that is still going.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.2"
  AWS_REGION: eu-west-3
  TF_IN_AUTOMATION: "true" # shorter output, made for CI
  TF_INPUT: "false"        # never wait for keyboard input

jobs:
  checks:
    name: Format, validate and Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check (all stacks)
        run: terraform fmt -check -recursive -diff terraform

      - name: Validate each stack (no AWS access needed)
        run: |
          for stack in terraform/*/; do
            echo "::group::validate ${stack}"
            terraform -chdir="${stack}" init -backend=false -lockfile=readonly
            terraform -chdir="${stack}" validate
            echo "::endgroup::"
          done

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Every failed check fails the build. Accepted risks are skipped in the code, with a reason.
      - name: Checkov
        run: |
          pip install checkov==3.4.5
          checkov -d terraform --framework terraform --compact --quiet

  plan:
    name: Plan (${{ matrix.stack }})
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for an OIDC token
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, lab]
    defaults:
      run:
        shell: bash # adds "pipefail": a failed plan fails the step, even with "| tee"
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get short-lived AWS credentials (OIDC, read-only role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}
          role-duration-seconds: 900 # 15 minutes is enough for a plan
          mask-aws-account-id: true  # the repo is public, so are its logs

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -lockfile=readonly

      - name: terraform plan
        run: terraform plan -lock-timeout=60s -no-color | tee plan.txt

      - name: Add the result to the run summary
        if: always()
        run: |
          {
            echo "### Plan: ${{ matrix.stack }}"
            grep -E '^(Plan:|No changes)' plan.txt || echo "No plan result. Read the logs."
          } >> "$GITHUB_STEP_SUMMARY"
